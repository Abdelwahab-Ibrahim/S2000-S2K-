<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GTed Auth</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="card">
    <div class="tabs">
      <button id="tab-login" class="tab active">Login</button>
      <button id="tab-register" class="tab">Register</button>
    </div>

    <!-- LOGIN FORM -->
    <form id="login-form" class="form active">
      <h2>Welcome back</h2>
      <input type="email" id="login-email" placeholder="Email" required />
      <input type="password" id="login-password" placeholder="Password" required />
      <button type="submit">Log In</button>
    </form>

    <!-- REGISTER FORM -->
    <form id="register-form" class="form">
      <h2>Create account</h2>
      <input type="text" id="register-name" placeholder="Name" required />
      <input type="email" id="register-email" placeholder="Email" required />
      <input type="password" id="register-password" placeholder="Password (min 6 chars)" required minlength="6" />
      <button type="submit">Register</button>
    </form>

    <p id="message"></p>

    <!-- LOGGED IN STATE -->
    <div id="profile" class="hidden">
      <h2>Logged in ✅</h2>
      <p id="profile-info"></p>
      <button id="logout-btn">Log Out</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
